name: Test

on:
  push:
    branches: ["main"]
  pull_request:

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get install --no-install-recommends lua5.4
      - run: sudo npm i -g tree-sitter-cli
      - run: make test
      - run: make -j2 test-boogie
      - run: make -j6 force
      - run: git diff --exit-code

